<!DOCTYPE html>
<html lan="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" contact="width=device-width, initial-scale=1.0">
    <title>AI HealthCare Assistant</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>

<body>
    <h1 class="main-heading">AI HealthCare Assistant</h1>
    <div class="container">
        <h2>Ask Anything</h2>
        <p id="ans-loading" style="display:none">Processing...</p>
        <p id="answer"></p>
        <form id="askform">
            <input type="text" name="question" placeholder="Ask anything..." required>
            <button type="submit">Ask</button>
        </form>
    </div>
    <script>
        document.getElementById("askform").onsubmit = async (e) => {
            e.preventDefault();

            let formData = new FormData(e.target);
            let loading = document.getElementById("ans-loading");
            loading.style.display = "block";

            let res = await fetch("/ask", {
                method: "POST",
                body: formData
            });

            let data = await res.json();
            document.getElementById("answer").innerText = data.response;

            loading.style.display = "none";   // hide loader
        }
    </script>
</body>

</html>
